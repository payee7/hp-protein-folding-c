name: C/C++ CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_and_test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Run (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          make
          make test
          make benchmark
          ./hp_protein_solver "HPHPPHHPHPPHPHHPPHPH"

      - name: Build with CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build . --config Release
          ctest --output-on-failure -C Release || true
          .\Release\hp_protein_solver.exe "HPHPPHHPHPPHPHHPPHPH"
